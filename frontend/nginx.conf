server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for JS/CSS
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
